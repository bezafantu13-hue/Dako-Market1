<!doctype html>
<!-- Dako Market consolidated single-file build. Supabase JS and web fonts load from CDN. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dako Market</title>
<meta name="description" content="Dako Market — social media account marketplace with account verification and order workflow.">
<meta name="theme-color" content="#101217">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1220;--sf:#1a1f33;--ink:#f1f3f8;--mu:#9aa3b5;--ln:#2b3149;--gold:#f5b400;--gold2:#ffe36a;--gd:#b87700;--ok:#16a05a;--bad:#d93a3a;--wn:#3a2f10;--wi:#f3d98a;--tg:#2c3242;--tgi:#cfd5e3;--okt:#4ade80;--bdt:#ff8a8a;--p1:#ffe36a;--p2:#f5b400;--sh:0 1px 0 #ffffff12 inset,0 14px 30px rgba(0,0,0,.4);box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f2f5;--sf:#fff;--ink:#14161c;--mu:#667085;--ln:#e3e6ec;--wn:#fff4d6;--wi:#5b4300;--tg:#e8eaf0;--tgi:#3b4252;--okt:#0b6b3a;--bdt:#9b1c1c;--p1:#e0a000;--p2:#a86800;--sh:0 1px 0 #fff inset,0 2px 4px rgba(20,22,28,.06),0 12px 28px rgba(20,22,28,.10)}}
:root[data-theme="light"]{--bg:#f1f2f5;--sf:#fff;--ink:#14161c;--mu:#667085;--ln:#e3e6ec;--wn:#fff4d6;--wi:#5b4300;--tg:#e8eaf0;--tgi:#3b4252;--okt:#0b6b3a;--bdt:#9b1c1c;--p1:#e0a000;--p2:#a86800;--sh:0 1px 0 #fff inset,0 2px 4px rgba(20,22,28,.06),0 12px 28px rgba(20,22,28,.10)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;padding-bottom:88px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.w{max-width:600px;margin:auto;padding:0 16px}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#23262f,#101217);color:#fff;padding:calc(8px + env(safe-area-inset-top,0px)) 0 10px;box-shadow:0 8px 24px rgba(0,0,0,.28);border-bottom:2px solid var(--gold)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lg{height:42px;width:auto;border-radius:10px;background:#fff;padding:2px 6px;box-shadow:0 2px 0 var(--gd),0 6px 14px rgba(0,0,0,.4)}
.me{display:flex;align-items:center;gap:8px;font-size:12px;border:0;background:#ffffff14;color:#fff;border-radius:99px;padding:4px 12px 4px 4px}
.av{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}.av img{width:150%;margin-left:-8%}
.q{width:100%;margin-top:9px;border:0;background:#ffffff1c;color:#fff;border-radius:14px;padding:11px 14px;box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}.q::placeholder{color:#ffffffa0}
.row{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 13px 5px 6px;font-size:13px;font-weight:600;box-shadow:var(--sh)}
.chip.t{padding:7px 14px}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d00;border-color:var(--gd);box-shadow:0 3px 0 var(--gd),0 8px 14px rgba(184,119,0,.35)}
.bt{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 #ffffff80,inset 0 -3px 5px rgba(0,0,0,.25),0 2px 5px rgba(0,0,0,.25)}.bt svg{width:16px;height:16px}.bt.l{width:38px;height:38px;border-radius:12px}.bt.l svg{width:23px;height:23px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:3px;margin:6px 0;box-shadow:inset 0 2px 5px rgba(20,22,28,.08)}
.seg button{border:0;background:none;border-radius:11px;padding:8px 4px;font-size:12px;font-weight:700;color:var(--mu)}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#2b2e38,#14161c);color:var(--gold2);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.nt{background:var(--wn);color:var(--wi);border-radius:12px;padding:10px 12px;font-size:12px;margin:10px 0}
.card{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--sh);width:100%;text-align:left;display:block;transition:transform .15s}
.card[data-a]{cursor:pointer}.card[data-a]:active{transform:translateY(2px) scale(.99)}
.card:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--gold2),var(--gd))}
.ct{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pl{display:flex;align-items:center;gap:8px;font-weight:800}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--tg);color:var(--tgi)}
.tag.m{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1d00;box-shadow:0 1px 0 #fff8 inset}
.tag.ok{background:rgba(22,160,90,.18);color:var(--okt)}.tag.bd{background:rgba(217,58,58,.18);color:var(--bdt)}
.card h3{margin:8px 0 2px;font-size:15px;line-height:1.4}
.st{display:flex;gap:14px;flex-wrap:wrap;color:var(--mu);font-size:12px;margin:2px 0 10px}.st b{color:var(--ink)}
.cb{display:flex;justify-content:space-between;align-items:end;border-top:1px dashed var(--ln);padding-top:10px}
.pr{font-size:21px;font-weight:800;background:linear-gradient(180deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sm{font-size:11px;color:var(--mu)}.vr{color:var(--ok);font-size:11px;font-weight:700}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;width:100%;color:#2a1d00;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#e29a00);box-shadow:0 1px 0 #fffb inset,0 4px 0 var(--gd),0 10px 18px rgba(184,119,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #fffb inset,0 1px 0 var(--gd),0 4px 8px rgba(184,119,0,.3)}
.btn.dk{color:var(--gold2);background:linear-gradient(180deg,#32353f,#14161c);box-shadow:0 1px 0 #ffffff30 inset,0 4px 0 #000,0 10px 18px rgba(0,0,0,.3)}
.btn.rd{color:#fff;background:linear-gradient(180deg,#f06a6a,#d93a3a);box-shadow:0 1px 0 #fff6 inset,0 4px 0 #8f1f1f}
.btn.sx{width:auto;padding:7px 12px;font-size:12px;border-radius:11px;box-shadow:0 1px 0 #fffb inset,0 2px 0 var(--gd)}
.btn+.btn{margin-top:10px}
.f{margin:10px 0}.f label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--mu)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--ln);background:var(--sf);border-radius:13px;padding:12px;box-shadow:inset 0 2px 4px rgba(20,22,28,.06)}.f textarea{min-height:78px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav.tb{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(180deg,#23262f,#101217);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--gold)}
nav.tb div{display:flex;max-width:600px;margin:auto}
nav.tb button{flex:1;border:0;background:none;color:#aeb4c2;font-size:11px;font-weight:700;display:grid;justify-items:center;gap:1px;padding:4px}nav.tb span{font-size:20px;line-height:1.1}
nav.tb button[aria-current="page"]{color:var(--gold2)}nav.tb button[aria-current="page"] span{filter:drop-shadow(0 0 6px var(--gold))}
.sheet{position:fixed;inset:0;background:rgba(5,8,14,.6);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.auth{position:fixed;inset:0;z-index:12;overflow:auto;background:radial-gradient(120% 70% at 50% 0,#3a3320 0,#101217 60%);padding:calc(24px + env(safe-area-inset-top,0px)) 16px 30px;display:flex;justify-content:center}
.ab{width:100%;max-width:420px}.hero{background:#fff;border-radius:24px;padding:14px;box-shadow:0 2px 0 var(--gd),0 22px 40px rgba(0,0,0,.5);position:relative;overflow:hidden}.hero img{width:100%;display:block}
.hero:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-20deg);animation:sw 1.6s .4s 1 both}
@keyframes sw{to{left:130%}}
@media (prefers-reduced-motion:reduce){.hero:after,.panel{animation:none}}
.ac{background:var(--sf);border-radius:22px;padding:16px;margin-top:16px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.kv div{background:var(--sf);border:1px solid var(--ln);border-radius:13px;padding:9px 12px;box-shadow:var(--sh)}.kv b{display:block;font-size:15px}
.sp{list-style:none;padding:0;margin:10px 0}.sp li{display:flex;gap:10px;padding:6px 0;color:var(--mu);font-size:13px}
.sp li i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-style:normal;font-size:11px}
.sp li.d{color:var(--ink)}.sp li.d i{background:var(--ok);border-color:var(--ok);color:#fff}.sp li.n{color:var(--ink);font-weight:700}.sp li.n i{background:var(--gold);border-color:var(--gd);color:#2a1d00}
.em{text-align:center;padding:36px 12px;color:var(--mu)}h2{font-size:19px;margin:14px 0 4px}
.tt{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#14161c;color:var(--gold2);padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.th{width:100%;height:170px;object-fit:cover;border-radius:14px;margin-top:10px;display:block;box-shadow:0 6px 14px rgba(0,0,0,.18)}.ph{height:84px;margin-top:10px;border-radius:14px;display:grid;place-items:center;font-size:12px;color:var(--mu);background:repeating-linear-gradient(45deg,var(--ln) 0 8px,transparent 8px 16px)}
.shots{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}.shots div{position:relative}.shots img{width:78px;height:78px;object-fit:cover;border-radius:12px;box-shadow:var(--sh)}.shots button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:800;line-height:1}
.gal{display:flex;gap:8px;overflow-x:auto;margin:8px 0;scroll-snap-type:x mandatory}.gal img{height:240px;border-radius:14px;flex:none;scroll-snap-align:start;box-shadow:var(--sh)}.lk{display:block;word-break:break-all;font-size:12px;font-weight:700;color:var(--gd);margin:4px 0}
.ur{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln)}.ur:last-child{border:0}
.led{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--bdt);background:rgba(239,68,68,.16);border-radius:99px;padding:3px 11px;margin:4px 0}.led:before{content:"";width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 0 rgba(239,68,68,.7);animation:pl 1.3s infinite}@keyframes pl{70%{box-shadow:0 0 0 8px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}@media (prefers-reduced-motion:reduce){.led:before{animation:none}}.btn:disabled{opacity:.5;box-shadow:none}
.seg.sc{overflow-x:auto;grid-auto-columns:minmax(78px,1fr);scrollbar-width:none}.seg.sc::-webkit-scrollbar{display:none}
.hb{display:flex;align-items:center;gap:8px}.ib{width:38px;height:38px;border-radius:50%;border:1px solid #ffffff2a;background:#ffffff14;color:#fff;display:grid;place-items:center;position:relative;text-decoration:none;font-size:16px;padding:0}.tgb{background:#27A7E7;border-color:#27A7E7}.ib .dot{position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #14161c}
.chipw{border:1px solid var(--gd);background:#ffffff10;color:var(--gold2);border-radius:99px;padding:8px 12px;font-weight:800;font-size:13px}
.fab{position:fixed;right:14px;bottom:104px;z-index:7;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--gold2),var(--gold) 60%,#e29a00);box-shadow:0 1px 0 #fffb inset,0 4px 0 var(--gd),0 12px 22px rgba(0,0,0,.45);color:#2a1d00;font-size:24px;padding:0;display:grid;place-items:center}.fab small{position:absolute;bottom:-5px;right:-8px;background:#14161c;color:var(--gold2);font-size:10px;font-weight:800;border-radius:99px;padding:1px 8px;border:1px solid var(--gd)}
nav.tb .sellb{overflow:visible}.sellb b{width:56px;height:56px;border-radius:50%;margin-top:-30px;display:grid;place-items:center;font-size:30px;color:#2a1d00;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#e29a00);box-shadow:0 1px 0 #fffb inset,0 4px 0 var(--gd),0 10px 18px rgba(184,119,0,.4)}nav.tb .sellb span{font-size:11px}
.wb{font-size:24px;line-height:1.25;margin:16px 0 4px}.wb em{color:var(--gold);font-style:normal}.sg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.stc{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:14px;box-shadow:var(--sh)}.ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px}.ico.g{background:#12372f;color:#34d399}.ico.y{background:#3d2f12;color:#fbbf24}.ico.b{background:#16294d;color:#60a5fa}.ico.c{background:#10394a;color:#22d3ee}.ico.t{background:#143a38;color:#2dd4bf}
.live{font-size:11px;font-weight:700;color:var(--okt);background:rgba(22,160,90,.16);border:1px solid rgba(22,160,90,.4);border-radius:99px;padding:2px 10px}.sl{color:var(--mu);margin-top:14px;font-size:13px}.sv{font-size:22px;font-weight:800}
.ana{border-radius:18px;padding:12px 14px;margin:10px 0;border:1px solid var(--ln)}.ana .av2{font-size:22px;font-weight:800;margin-top:4px}.ana.ok{background:rgba(22,160,90,.12);border-color:rgba(22,160,90,.4);color:var(--okt)}.ana.pe{background:rgba(245,180,0,.12);border-color:rgba(245,180,0,.45);color:var(--wi)}.ana.no{background:rgba(217,58,58,.12);border-color:rgba(217,58,58,.4);color:var(--bdt)}
.pg{height:8px;border-radius:99px;background:var(--ln);margin-top:10px;overflow:hidden;display:flex}.pg i{background:#34d399}.pg b{background:#fbbf24}
.prof{text-align:center;padding:22px 14px}.prof:before,.mw:before{display:none}.ava{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:38px;font-weight:800;color:#14161c;background:linear-gradient(135deg,#d9c36a,#5fd0b0);position:relative;box-shadow:0 0 0 4px var(--sf),0 0 0 6px var(--ln)}
.ck{position:absolute;right:2px;bottom:4px;width:30px;height:30px;border-radius:50%;background:#10b981;color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px;box-shadow:0 0 0 3px var(--sf)}.pn{font-size:21px;display:block}.em2{display:inline-block;margin:8px 0 14px;border:1px solid var(--ln);border-radius:99px;padding:6px 16px;color:var(--mu)}
.mini{border:1px solid var(--ln);border-radius:16px;padding:10px 12px;text-align:left}.mini span{display:block;font-size:11px;color:var(--mu);font-weight:700}.mini b{font-size:19px}
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 8px;font-weight:800;font-size:13px;color:var(--mu)}.sec i{width:10px;height:10px;border-radius:50%}
.mw{padding:0;overflow:hidden}.mr{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:13px 16px;border-bottom:1px solid var(--ln);text-align:left}.mr:last-child{border:0}.mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--bg);font-size:20px}.ml{flex:1;font-weight:700;font-size:16px}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px;background:rgba(99,102,241,.2);color:#a5b4fc;border:1px solid rgba(99,102,241,.4)}.chev{width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--mu);font-size:20px}
.hrt{border:0;background:none;font-size:22px;color:var(--gold);line-height:1;padding:0 2px}.lnk{background:none;border:0;color:var(--gold);font-weight:700;padding:0}
.fb{background:var(--gold);color:#2a1d00;border-radius:99px;font-size:11px;padding:0 7px;font-weight:800}

/* Dako Market secure order chat */
.chat-box{display:flex;flex-direction:column;gap:10px;max-height:54vh;overflow:auto;padding:10px 2px}
.chat-line{max-width:88%;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);overflow-wrap:anywhere}
.chat-line.mine{align-self:flex-end;background:rgba(212,175,55,.12);border-color:rgba(212,175,55,.35)}
.chat-meta{font-size:10px;color:var(--muted);margin-bottom:4px;display:flex;gap:10px;justify-content:space-between}
.chat-compose{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.chat-compose textarea{flex:1;min-height:44px;max-height:120px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--text);font:inherit}
.chat-closed{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px}


/* DAKO MARKET MODERN REFRESH — preserves original logo and existing workflows */
:root{--gold:#e7b93f;--gold2:#ffe18a;--gd:#986b13;--bg:#111522;--sf:#1b2231;--ln:#30394c;--sh:0 12px 30px rgba(0,0,0,.24)}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:radial-gradient(120% 50% at 50% -10%,#343044 0%,var(--bg) 62%)}
.top{background:linear-gradient(135deg,#292a2e,#10131b 75%);border-bottom:2px solid #c89d32}
.lg{height:54px;width:auto;max-width:min(68vw,290px);object-fit:contain;object-position:left center;padding:0;background:transparent;border-radius:0;box-shadow:none;display:block}
.hero{padding:10px;background:#fff;border:1px solid #d8c48b}.hero img{width:100%;height:auto;max-height:210px;object-fit:contain}
.w{max-width:640px;padding-left:15px;padding-right:15px}
.card,.oc,.chatadm,.stc,.stc3{border-radius:22px;border-color:#30394c;background:linear-gradient(145deg,rgba(35,43,59,.98),rgba(23,29,43,.98));box-shadow:0 12px 28px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035)}
.card:before{background:linear-gradient(180deg,#ffe18a,#b9821c)}
.btn{background:linear-gradient(180deg,#ffe18a,#e5b43b 58%,#bd871c);color:#211805;letter-spacing:.1px}
.seg{border-radius:18px;background:#171d2a}.seg button{border-radius:14px}
.seg button[aria-pressed="true"]{background:linear-gradient(135deg,#ffe18a,#c9972d);color:#211805}
.q2,.q,.f input,.f select,.f textarea{border-radius:15px}
nav.tb{background:linear-gradient(180deg,#272a31,#11141c);border-top:1px solid #79602b}
nav.tb button[aria-current="page"]{color:#ffe18a}
.inh{gap:12px}.inico{border-radius:17px;background:linear-gradient(135deg,rgba(255,220,130,.2),rgba(192,135,25,.12));color:#ffe18a}
.chatadm{border:1px solid rgba(231,185,63,.45);background:linear-gradient(120deg,rgba(231,185,63,.16),rgba(27,34,49,.98));padding:16px}
.ava2{box-shadow:0 0 0 3px rgba(231,185,63,.55)}
.oc{transition:transform .16s ease,border-color .16s ease}.oc:active{transform:scale(.985)}
.chat-box{gap:12px;padding:14px 4px;scroll-behavior:smooth}
.chat-line{max-width:86%;padding:12px 14px;border-radius:18px 18px 18px 5px;background:#202a3b;border:1px solid #364258;color:#f5f6fa;box-shadow:0 5px 14px rgba(0,0,0,.12)}
.chat-line.mine{align-self:flex-end;border-radius:18px 18px 5px 18px;background:linear-gradient(145deg,rgba(231,185,63,.25),rgba(173,122,24,.18));border-color:rgba(231,185,63,.45)}
.chat-meta{color:#c0c8d6}.chat-compose textarea{background:#171e2c;border:1px solid #414b60;border-radius:16px;color:#fff;padding:12px}
.chat-compose .btn{width:auto;min-width:86px}
.panel{background:linear-gradient(160deg,#1b2231,#101522);border:1px solid #343d50;border-bottom:0}
@media(min-width:700px){.w{max-width:760px}.panel{border-radius:24px 24px 0 0}.lg{height:58px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}


/* Platform-wide brand themes: selected channel recolors the complete app. */
:root[data-platform="Facebook"]{--gold:#1877f2;--gold2:#65a8ff;--gd:#0b55c5;--p1:#8bc0ff;--p2:#1877f2;--wn:#102b50;--wi:#cfe4ff}
:root[data-platform="TikTok"]{--gold:#25f4ee;--gold2:#fe2c55;--gd:#b5173a;--p1:#25f4ee;--p2:#fe2c55;--wn:#30202b;--wi:#ffd7e0}
:root[data-platform="Instagram"]{--gold:#d6249f;--gold2:#fdc468;--gd:#a51b79;--p1:#fdc468;--p2:#d6249f;--wn:#35203a;--wi:#ffd9f4}
:root[data-platform="Telegram"]{--gold:#27a7e7;--gold2:#74d0ff;--gd:#1475ad;--p1:#74d0ff;--p2:#168bd0;--wn:#102d40;--wi:#cceeff}
:root[data-platform="YouTube"]{--gold:#ff3030;--gold2:#ff7777;--gd:#b51f1f;--p1:#ff7777;--p2:#e62117;--wn:#3a1717;--wi:#ffd6d6}
:root[data-platform="Facebook"] .top,:root[data-platform="TikTok"] .top,:root[data-platform="Instagram"] .top,:root[data-platform="Telegram"] .top,:root[data-platform="YouTube"] .top{border-bottom-color:var(--gold)}
:root[data-platform] .btn:not(.dk):not(.rd),:root[data-platform] .fab,:root[data-platform] nav.tb .sellb b{background:linear-gradient(145deg,var(--gold2),var(--gold) 58%,var(--gd));box-shadow:0 1px 0 #ffffff70 inset,0 4px 0 var(--gd),0 10px 18px color-mix(in srgb,var(--gold) 30%,transparent)}
:root[data-platform] .chip[aria-pressed="true"]{background:linear-gradient(145deg,var(--gold2),var(--gold));border-color:var(--gd);box-shadow:0 3px 0 var(--gd),0 8px 14px color-mix(in srgb,var(--gold) 30%,transparent)}
:root[data-platform] nav.tb{border-top-color:var(--gold)}:root[data-platform] nav.tb button[aria-current="page"]{color:var(--gold2)}
:root[data-platform] .card:before{background:linear-gradient(180deg,var(--gold2),var(--gd))}
:root[data-platform] :focus-visible{outline-color:var(--gold2)}
.platform-note{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:13px;background:color-mix(in srgb,var(--gold) 12%,var(--sf));border:1px solid color-mix(in srgb,var(--gold) 38%,var(--ln));font-size:12px;font-weight:700;margin:8px 0}
.demo-flag{display:inline-flex;align-items:center;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.3px;background:#fbbf2420;color:#fbbf24;border:1px solid #fbbf2460}

async function doAuth(){
 var e=($('ae').value||'').trim().toLowerCase(),p=$('ap').value||'';
 if(!e||p.length<6){tt('Enter a valid email and a password of 6+ characters');return}
 if(DB){
  try{
   if(S.mode==='up'){
    var nm=($('an').value||'').trim();if(!nm){tt('Enter your name');return}
    var role=$('ar').value;
    var {data,error}=await DB.auth.signUp({email:e,password:p,options:{data:{full_name:nm,role:role}}});
    if(error)throw error;
    if(data.session){await backendLogin(data.user);tt('Account created and signed in')}
    else tt('Signup submitted. Check email if confirmation is enabled.');
   }else{
    var {data,error}=await DB.auth.signInWithPassword({email:e,password:p});if(error)throw error;
    await backendLogin(data.user);tt('Logged in');
   }
  }catch(err){tt('Supabase auth error: '+(err.message||err))}
  return;
 }
 var h=await sha(p),u=S.u.filter(function(x){return x.e===e})[0];
 if(S.mode==='up'){
  if(u){tt('This email is already registered');return}
  var nm=($('an').value||'').trim();if(!nm){tt('Enter your name');return}
  u={id:'u'+Date.now(),n:nm,e:e,h:h,role:$('ar').value,v:0};S.u.push(u);
 }else if(!u||!u.h||u.h!==h){tt('Incorrect email or password');return}
 if(u.b){tt('Your account is suspended. Contact the admin');return}
 S.me=u.id;S.tab=u.role==='admin'?'admin':'dash';sv();render();
}
