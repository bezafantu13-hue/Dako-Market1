:root{--bg:#0f1220;--sf:#1a1f33;--ink:#f1f3f8;--mu:#9aa3b5;--ln:#2b3149;--gold:#f5b400;--gold2:#ffe36a;--gd:#b87700;--ok:#16a05a;--bad:#d93a3a;--wn:#3a2f10;--wi:#f3d98a;--tg:#2c3242;--tgi:#cfd5e3;--okt:#4ade80;--bdt:#ff8a8a;--p1:#ffe36a;--p2:#f5b400;--sh:0 1px 0 #ffffff12 inset,0 14px 30px rgba(0,0,0,.4);box-sizing:border-box}

.chat-box{display:flex;flex-direction:column;gap:10px;max-height:54vh;overflow:auto;padding:10px 2px}

async function openOrderChat(orderId){
 if(!DB||!DB_USER){tt('Please log in with your Supabase account to use order chat');return}
 if(ORDER_CHAT.channel){try{await DB.removeChannel(ORDER_CHAT.channel)}catch(e){}ORDER_CHAT.channel=null}
 ORDER_CHAT.order=String(orderId);ORDER_CHAT.closed=false;
 try{var st=await DB.from('dako_order_chats').select('order_id,closed_at,closed_by').eq('order_id',ORDER_CHAT.order).maybeSingle();if(st.error)throw st.error;ORDER_CHAT.closed=!!(st.data&&st.data.closed_at);
  sheet('<h2>Order chat</h2>'+orderChatMarkup());await loadOrderChat();
  ORDER_CHAT.channel=DB.channel('dako-order-chat-'+ORDER_CHAT.order).on('postgres_changes',{event:'*',schema:'public',table:'chat_messages',filter:'order_id=eq.'+ORDER_CHAT.order},function(){loadOrderChat()}).on('postgres_changes',{event:'*',schema:'public',table:'dako_order_chats',filter:'order_id=eq.'+ORDER_CHAT.order},async function(){var q=await DB.from('dako_order_chats').select('closed_at').eq('order_id',ORDER_CHAT.order).maybeSingle();ORDER_CHAT.closed=!!(q.data&&q.data.closed_at);if($('panel')){$('panel').innerHTML='<h2>Order chat</h2>'+orderChatMarkup();loadOrderChat()}}).subscribe();
 }catch(err){tt('Could not open order chat: '+(err.message||err))}
}
async function loadOrderChat(){
 if(!DB||!ORDER_CHAT.order||!$('orderChatMessages'))return;
 var r=await DB.from('chat_messages').select('id,sender_id,body,created_at').eq('order_id',ORDER_CHAT.order).order('created_at',{ascending:true}).limit(300);
 if(r.error){$('orderChatMessages').innerHTML='<div class="em">'+E(r.error.message)+'</div>';return}
 var box=$('orderChatMessages'),bottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
 box.innerHTML=(r.data||[]).map(function(m){var own=m.sender_id===DB_USER.id,who=own?'You':(me()&&me().role==='admin'?'Participant':'Other participant');return '<div class="chat-line '+(own?'mine':'')+'"><div class="chat-meta"><b>'+who+'</b><span>'+E(new Date(m.created_at).toLocaleString())+'</span></div><div>'+E(m.body).replace(/\n/g,'<br>')+'</div></div>'}).join('')||'<div class="em">No messages yet. Start the conversation.</div>';

}
async function sendOrderChat(e){
 e.preventDefault();var input=$('orderChatText'),body=(input&&input.value||'').trim();if(!body||!DB||!DB_USER||ORDER_CHAT.closed)return;
 input.disabled=true;
 try{var r=await DB.from('chat_messages').insert({order_id:ORDER_CHAT.order,support_user_id:null,sender_id:DB_USER.id,body:body});if(r.error)throw r.error;input.value='';await loadOrderChat()}
 catch(err){tt('Message not sent: '+(err.message||err))}finally{if($('orderChatText')){$('orderChatText').disabled=false;$('orderChatText').focus()}}
}
async function closeOrderChat(orderId){
 if(!DB||!DB_USER||!me()||me().role!=='admin'){tt('Only an admin can close this chat');return}
 if(!confirm('Close this order chat? No one will be able to send more messages.'))return;
 var r=await DB.rpc('close_dako_order_chat',{p_order_id:orderId});if(r.error)throw r.error;
 ORDER_CHAT.closed=true;if($('panel')){$('panel').innerHTML='<h2>Order chat</h2>'+orderChatMarkup();await loadOrderChat()}tt('Order chat closed. History is preserved.');
}
